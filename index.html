</head><body><div class="app" id="app"></div><script>

const ROLESETS=[
['DAFÜR','DAGEGEN','FREIE WAHL · EHER EHRLICH','FREIE WAHL · EHER BLUFFEN'],
['UNTERSTÜTZE DIE MEHRHEIT','STELLE DICH GEGEN DIE MEHRHEIT','VERMITTLE ZWISCHEN BEIDEN SEITEN','VERSUCHE JEMANDEN UMZUSTIMMEN'],
['ARGUMENTIERE EMOTIONAL DAFÜR','ARGUMENTIERE SACHLICH DAGEGEN','NENNE EIN BEISPIEL, DAS DIE POSITION STÜTZT','NENNE EIN GEGENBEISPIEL'],

];
let S={players:[],colors:{},round:1,total:4,questionsPerRound:5,question:0,cats:Object.keys(BANK),used:[],speaker:null,statement:'',roles:null,pass:0,guesses:[],scores:{},screen:'setup',actor:null,target:null,guesser:null,lastPair:'',actorCounts:{}};let interval;
const E=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function shell(body,formula='=COLOR_BLUFF()',status='WORKBOOK 02'){app.innerHTML=`<div class="top"><div class="logo">COLOR BLUFF</div><div class="formula">fx&nbsp;&nbsp;${formula}</div><div class="status">${status}</div></div>${body}`}
function rows(items){return `<div class="sheetFrame"><div class="corner"></div><div class="colLetters">${['A','B','C','D','E','F','G','H'].map(x=>`<span>${x}</span>`).join('')}</div><div class="sheet">${items.map((x,i)=>`<div class="r"><div class="rn">${i+1}</div><div class="cells ${x.cls||''}">${x.html}</div></div>`).join('')}</div></div>`}
function setup(){let cats=Object.keys(BANK);shell(rows([{html:`<div class="c h">NEUE PARTIE · V2.14</div>`},{html:`<div class="c hero">Geheime Farbe.<br>Öffentliche Diskussion.<br><span class="muted">Niemand darf dich lesen.</span></div>`},{cls:'grid2',html:`<div class="c"><b>SPIELER</b><div class="playerTable"><div class="playerRow"><div class="playerNum">1</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 1"></div><div class="playerRow"><div class="playerNum">2</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 2"></div><div class="playerRow"><div class="playerNum">3</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 3"></div><div class="playerRow"><div class="playerNum">4</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 4"></div><div class="playerRow"><div class="playerNum">5</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 5"></div><div class="playerRow"><div class="playerNum">6</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 6"></div><div class="playerRow"><div class="playerNum">7</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 7"></div><div class="playerRow"><div class="playerNum">8</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 8"></div><div class="playerRow"><div class="playerNum">9</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 9"></div><div class="playerRow"><div class="playerNum">10</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 10"></div><div class="playerRow"><div class="playerNum">11</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 11"></div><div class="playerRow"><div class="playerNum">12</div><input class="playerName" maxlength="24" autocomplete="off" aria-label="Spieler 12"></div></div></div><div class="c"><b>PARTIE</b><div style="margin-top:10px">Runden</div><select id="rounds"><option selected>4</option><option>6</option><option>8</option><option>10</option><option>12</option></select><div style="margin-top:14px">Fragen pro Runde</div><select id="questionsPerRound"><option>3</option><option selected>5</option><option>6</option><option>8</option></select><div class="small muted" style="margin-top:6px">BAR-MODUS: 4 × 5 = 20 Diskussionen · ideal für 5–6 Leute.</div><div style="margin-top:14px">Kategorien</div>${cats.map((c,i)=>`<label style="display:block;padding:5px 0"><input type="checkbox" class="cat" value="${E(c)}" checked> ${E(c)}</label>`).join('')}</div>`}]),'<NEW_GAME>','SETUP');app.innerHTML+=`<div class="actions"><button class="btn green" onclick="start()">PARTIE STARTEN</button></div>`;
const playerColors=[
  '#2563eb', // Blau
  '#dc2626', // Rot
  '#16a34a', // Grün
  '#ca8a04', // Gelb
  '#9333ea', // Lila
  '#ea580c', // Orange
  '#0891b2', // Cyan
  '#db2777', // Pink
  '#4f46e5', // Indigo
  '#65a30d', // Lime
  '#0d9488', // Türkis
  '#c026d3'  // Magenta
];

// Farben einmal mischen – jede der 12 Farben wird pro Partie genau einmal vergeben.
const shuffledPlayerColors = [...playerColors];
for (let i = shuffledPlayerColors.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [shuffledPlayerColors[i], shuffledPlayerColors[j]] =
    [shuffledPlayerColors[j], shuffledPlayerColors[i]];
}

document.querySelectorAll('.playerName').forEach((el,i)=>{
  const assignedColor = shuffledPlayerColors[i];
  const paint=()=>{
    const on=!!el.value.trim();
    el.classList.toggle('filled',on);
    el.style.setProperty('background-color',on?assignedColor:'#0b110d','important');
    el.style.setProperty('color',on?'#ffffff':'#eef4ef','important');
  };
  el.addEventListener('input',paint);
  el.addEventListener('change',paint);
  paint();
});
}
function errorTab(msg){let old=document.getElementById('errorOverlay');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="errorOverlay" id="errorOverlay" onclick="if(event.target===this)this.remove()"><div class="errorBox"><div class="errorHead">#ERROR!</div><div class="errorBody">${E(msg)}</div><div class="errorActions"><button class="btn danger" onclick="document.getElementById('errorOverlay').remove()">OKAY</button></div></div></div>`)}
function assignRoundColors(){
  let bag=[]; while(bag.length<S.players.length)for(let i=0;i<4&&bag.length<S.players.length;i++)bag.push(i);
  bag.sort(()=>Math.random()-.5); S.players.forEach((x,i)=>S.colors[x]=bag[i]);
}
function start(){let p=[...document.querySelectorAll('.playerName')].map(x=>x.value.trim()).filter(Boolean);if(p.length<4)return errorTab('Yo, du brauchst mindestens 4 Spieler.');if(new Set(p.map(x=>x.toLowerCase())).size!==p.length)return errorTab('Jeder Spieler braucht einen eigenen Namen.');S.players=p;S.total=+document.getElementById('rounds').value;S.questionsPerRound=+document.getElementById('questionsPerRound').value;S.cats=[...document.querySelectorAll('.cat:checked')].map(x=>x.value);if(!S.cats.length)return errorTab('Wähl mindestens eine Kategorie aus.');S.players.forEach(x=>S.scores[x]=0);S.round=1;S.question=0;S.pass=0;S.guesses=[];S.actorCounts={};S.lastPair='';assignRoundColors();dealPass()}
function dealPass(){let p=S.players[S.pass];shell(rows([{html:`<div class="c h">RUNDE ${S.round}/${S.total} · GEHEIME VERTEILUNG ${S.pass+1}/${S.players.length}</div>`},{html:`<div class="c center hero">Gerät an<br>${E(p)}<br><span class="muted">weitergeben.</span></div>`}]),'=PRIVATE_COLOR()','SECRET');app.innerHTML+=`<div class="actions"><button class="btn" onclick="showColor()">MEINE FARBE ANZEIGEN</button></div>`}
function showColor(){let p=S.players[S.pass],c=COLORS[S.colors[p]];shell(rows([{html:`<div class="c h">NUR FÜR ${E(p).toUpperCase()}</div>`},{html:`<div class="c center hero" style="color:${c.c}">● ${c.n}</div>`},{html:`<div class="c center muted">Merke dir deine Farbe. Sie gilt für diese Runde und wird in der nächsten Runde neu verteilt.</div>`}]),'=MY_COLOR()','PRIVATE');app.innerHTML+=`<div class="actions"><button class="btn dark" onclick="hideColor()">VERBERGEN & WEITER</button></div>`}
function hideColor(){S.pass++;if(S.pass<S.players.length)dealPass();else nextQuestion()}
function pickStatement(){let pool=[];S.cats.forEach(c=>BANK[c].forEach(q=>pool.push({c,q})));let avail=pool.filter(x=>!S.used.includes(x.q));if(!avail.length){S.used=[];avail=pool}let x=avail[Math.floor(Math.random()*avail.length)];S.used.push(x.q);return x}
function pickPair(){
  let min=Math.min(...S.players.map(p=>S.actorCounts[p]||0));
  let actors=S.players.filter(p=>(S.actorCounts[p]||0)===min).sort(()=>Math.random()-.5);
  let actor=actors[0], targets=S.players.filter(p=>p!==actor && `${actor}|${p}`!==S.lastPair).sort(()=>Math.random()-.5);
  if(!targets.length)targets=S.players.filter(p=>p!==actor).sort(()=>Math.random()-.5);
  let target=targets[0]; S.actorCounts[actor]=(S.actorCounts[actor]||0)+1; S.lastPair=`${actor}|${target}`; return [actor,target];
}
function nextQuestion(){
  clearInterval(interval);
  if(S.question>=S.questionsPerRound){
    if(S.round>=S.total)return finalGuessStart();
    S.round++;S.question=0;S.pass=0;assignRoundColors();return dealPass();
  }
  S.question++; let x=pickStatement();S.statement=x.q;S.category=x.c;
  [S.actor,S.target]=pickPair();S.guesser=S.target;interactionBoard();
}
function interactionBoard(){
  shell(rows([
    {cls:'grid3',html:`<div class="c h">RUNDE ${S.round}/${S.total} · FRAGE ${S.question}/${S.questionsPerRound}</div><div class="c h">${E(S.category).toUpperCase()}</div><div class="c h">1 VS 1</div>`},
    {html:`<div class="c bigStatement">„${E(S.statement)}“</div>`},
    {html:`<div class="c hero" style="font-size:34px">${E(S.actor)} → ${E(S.target)}</div>`},
    {html:`<div class="c"><b>${E(S.actor)}</b>: Erkläre <b>${E(S.target)}</b> deine Meinung dazu.<br><br><b>${E(S.target)}</b>: Hör genau zu. Danach kannst du freiwillig die Farbe von ${E(S.actor)} raten.<br><br><span class="muted">Alle anderen dürfen zuhören, reinrufen und mitdiskutieren.</span></div>`},
    {html:`<div class="c" style="padding:0"><div class="roles"><div class="roleColor" style="color:#ff5a64">ROT</div><div class="roleText">DAFÜR</div><div class="roleColor" style="color:#5d8cff">BLAU</div><div class="roleText">DAGEGEN</div><div class="roleColor" style="color:#42d987">GRÜN</div><div class="roleText">FREIE WAHL · EHER EHRLICH</div><div class="roleColor" style="color:#ffd54a">GELB</div><div class="roleText">FREIE WAHL · EHER BLUFFEN</div></div></div>`}
  ]),'=PLAYER_TO_PLAYER()','PUBLIC');
  app.innerHTML+=`<div class="actions"><button class="btn green" onclick="privateActor()">PRIVATE AUFGABE</button></div>`;
}
function privateActor(){
  let ci=S.colors[S.actor],c=COLORS[ci];
  const roleNames=['DAFÜR','DAGEGEN','EHRLICH','BLUFF'];
  const roleTasks=[
    `Du bist DAFÜR. Vertrete die Aussage gegenüber ${E(S.target)} – auch wenn du persönlich anders denkst.`,
    `Du bist DAGEGEN. Widersprich der Aussage gegenüber ${E(S.target)} – auch wenn du persönlich anders denkst.`,
    `Du bist EHRLICH. Du hast freie Wahl: Sag ${E(S.target)} möglichst das, was du wirklich über die Frage denkst.`,
    `Du bist BLUFF. Du hast freie Wahl: Täusche ${E(S.target)} eher, verschleiere deine echte Meinung oder spiele bewusst eine andere Haltung.`
  ];
  shell(rows([
    {html:`<div class="c h">HANDY NUR AN ${E(S.actor).toUpperCase()}</div>`},
    {html:`<div class="c bigStatement">„${E(S.statement)}“</div>`},
    {html:`<div class="c center hero" style="color:${c.c}">● ${c.n}<br><span style="font-size:.45em">${roleNames[ci]}</span></div>`},
    {html:`<div class="c center">${roleTasks[ci]}</div>`}
  ]),'=PRIVATE_TASK()','SECRET');
  app.innerHTML+=`<div class="actions"><button class="btn dark" onclick="discussion(45)">FARBE VERBERGEN → LOS</button></div>`;
}
function discussion(sec){
  clearInterval(interval);let t=sec;
  let render=()=>shell(rows([
    {cls:'grid3',html:`<div class="c h">RUNDE ${S.round}/${S.total} · FRAGE ${S.question}/${S.questionsPerRound}</div><div class="c h">${E(S.category).toUpperCase()}</div><div class="c h">LIVE</div>`},
    {html:`<div class="c bigStatement">„${E(S.statement)}“</div>`},
    {html:`<div class="c center"><b>${E(S.actor)} → ${E(S.target)}</b><br><span class="muted">${E(S.actor)} erklärt seine Meinung. ${E(S.target)} hört zu und kann danach freiwillig die Farbe erraten.</span><div class="small muted" style="margin-top:20px">=TIME_LEFT()</div><div class="timer" id="timer">${t}</div><div class="progress"><i id="bar" style="width:${t/sec*100}%"></i></div></div>`}
  ]),'=DISCUSSION_TIMER()','LIVE');
  render();
  app.innerHTML+=`<div class="actions"><button class="btn dark" onclick="finishDiscussion()">DISKUSSION BEENDEN</button></div>`;
  interval=setInterval(()=>{t--;let e=document.getElementById('timer'),b=document.getElementById('bar');if(e)e.textContent=t;if(b)b.style.width=(t/sec*100)+'%';if(t<=0){clearInterval(interval);finishDiscussion()}},1000);
}
function finishDiscussion(){clearInterval(interval);suspicion()}
function suspicion(){
  S.guesser=S.target;
  shell(rows([
    {html:`<div class="c h">GUESS · RUNDE ${S.round}</div>`},
    {html:`<div class="c center hero">${E(S.target)}, welche Farbe hat<br>${E(S.actor)}?</div>`},
    {html:`<div class="c center muted">Du kannst eine Farbe raten – musst aber nicht. Wenn du rätst: richtig = 1 Schluck verteilen, falsch = 1 Schluck trinken.</div>`}
  ]),'=GUESS_COLOR()','CHECKPOINT');
  app.innerHTML+=`<div class="guessGrid">${COLORS.map((c,i)=>`<button class="guess" style="background:${c.c};color:${i===3?'#111':'white'}" onclick="guess(${i})">${c.n}</button>`).join('')}</div><div class="actions"><button class="btn dark" onclick="skipGuess()">NICHT RATEN → WEITER</button></div>`;
}
function skipGuess(){
  shell(rows([
    {html:`<div class="c h">GUESS ÜBERSPRUNGEN</div>`},
    {html:`<div class="c center hero">${E(S.target)} passt.</div>`},
    {html:`<div class="c center muted">Kein Tipp, kein Schluck. Die Farbe von ${E(S.actor)} bleibt geheim.</div>`}
  ]),'=SKIP_GUESS()','PASS');
  app.innerHTML+=`<div class="actions"><button class="btn green" onclick="nextQuestion()">WEITER</button></div>`;
}
function guess(i){
  let correct=i===S.colors[S.actor], real=COLORS[S.colors[S.actor]];
  S.guesses.push({a:S.target,b:S.actor,i,correct,round:S.round,question:S.question});
  if(correct)S.scores[S.target]++;
  shell(rows([
    {html:`<div class="c h">${correct?'✓ RICHTIG':'× FALSCH'}</div>`},
    {html:`<div class="c center hero">${E(S.actor)} war <span style="color:${real.c}">● ${real.n}</span></div>`},
    {html:`<div class="c center">${correct?`<b>${E(S.target)}</b> hat richtig geraten und darf <b>1 Schluck verteilen.</b>`:`<b>${E(S.target)}</b> lag falsch und trinkt <b>1 Schluck.</b>`}</div>`}
  ]),'=REVEAL_GUESS()','RESULT');
  app.innerHTML+=`<div class="actions"><button class="btn green" onclick="nextQuestion()">WEITER</button></div>`;
}
function finalGuessStart(){S.finalIndex=0;S.finalAnswers={};finalGuessPerson()}
function finalGuessPerson(){if(S.finalIndex>=S.players.length)return finale();let p=S.players[S.finalIndex];S.finalAnswers[p]={};let targets=S.players.filter(x=>x!==p);S.finalTargets=targets;S.finalTargetIndex=0;finalGuessTarget()}
function finalGuessTarget(){let p=S.players[S.finalIndex];if(S.finalTargetIndex>=S.finalTargets.length){S.finalIndex++;return finalGuessPerson()}let t=S.finalTargets[S.finalTargetIndex];shell(rows([{html:`<div class="c h">FINALE · ${E(p).toUpperCase()}</div>`},{html:`<div class="c center hero">Welche Farbe hat<br>${E(t)}?</div>`},{html:`<div class="c center muted">Diese finale Zuordnung bleibt bis zur Auflösung geheim.</div>`}]),'=FINAL_GUESS()','PRIVATE');app.innerHTML+=`<div class="guessGrid">${COLORS.map((c,i)=>`<button class="guess" style="background:${c.c};color:${i===3?'#111':'white'}" onclick="finalPick(${i})">${c.n}</button>`).join('')}</div>`}
function finalPick(i){let p=S.players[S.finalIndex],t=S.finalTargets[S.finalTargetIndex];S.finalAnswers[p][t]=i;if(i===S.colors[t])S.scores[p]++;S.finalTargetIndex++;finalGuessTarget()}
function finale(){let conceal={};S.players.forEach(t=>{let wrong=0,total=0;S.players.forEach(p=>{if(p!==t&&S.finalAnswers[p]){total++;if(S.finalAnswers[p][t]!==S.colors[t])wrong++}});conceal[t]=total?wrong:0});shell(rows([{html:`<div class="c h">FINALE · AUFLÖSUNG</div>`},{html:`<div class="c hero">Wer hat wen gelesen?</div>`},{html:`<div class="c" style="padding:0">${S.players.map(p=>{let c=COLORS[S.colors[p]];return `<div class="scoreRow"><div><b>${E(p)}</b> &nbsp;<span style="color:${c.c}">● ${c.n}</span></div><div>ERKANNT ${S.scores[p]}</div><div>GETARNT ${conceal[p]}</div></div>`}).join('')}</div>`},{html:`<div class="c small muted">ERKANNT = richtige Verdachts-/Finaltipps · GETARNT = wie viele Mitspieler deine Farbe im Finale falsch eingeschätzt haben.</div>`}]),'=REVEAL_ALL()','GAME OVER');app.innerHTML+=`<div class="actions"><button class="btn green" onclick="resetGame()">NEUE PARTIE</button><button class="btn dark" onclick="showLog()">VERDACHTSLOG</button></div>`}
function showLog(){shell(rows([{html:`<div class="c h">VERDACHTSLOG</div>`},{html:`<div class="c">${S.guesses.length?S.guesses.map(g=>`R${g.round}/F${g.question||'?'}: <b>${E(g.a)}</b> → ${E(g.b)} = <span style="color:${COLORS[g.i].c}">${COLORS[g.i].n}</span> ${g.correct?'✓':'×'}`).join('<br><br>'):'Keine Zwischenverdachte in dieser Partie.'}</div>`}]),'=GUESS_LOG()','ARCHIVE');app.innerHTML+=`<div class="actions"><button class="btn" onclick="finale()">ZURÜCK</button></div>`}
function resetGame(){clearInterval(interval);S={players:[],colors:{},round:1,total:4,questionsPerRound:5,question:0,cats:Object.keys(BANK),used:[],speaker:null,statement:'',roles:null,pass:0,guesses:[],scores:{},screen:'setup',actor:null,target:null,guesser:null,lastPair:'',actorCounts:{}};setup()}
setup();
</script></body></html>
