<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>COLOR BLUFF Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0e12;color:#f5f5f7;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;padding:28px 18px}.card{background:#17191f;border:1px solid #2b2e37;border-radius:20px;padding:24px;margin:16px 0}.brand{letter-spacing:.16em;font-weight:900;font-size:13px;color:#aaa}.title{font-size:clamp(32px,6vw,58px);margin:6px 0 8px}.muted{color:#a9acb6}.row{display:flex;gap:10px;flex-wrap:wrap}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}.pill{padding:12px;background:#22252d;border-radius:12px;text-align:center}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px;cursor:pointer;background:#f3f3f5;color:#111}.btn.secondary{background:#2a2d36;color:#fff}.btn.red{background:#ff4d55}.btn.blue{background:#4b83ff}.btn.green{background:#36c982}.btn.yellow{background:#ffd447;color:#171717}.btn:disabled{opacity:.45}.statement{font-size:clamp(23px,4vw,38px);line-height:1.2;font-weight:850}.role{font-size:24px;font-weight:900}.timer{font-size:48px;font-variant-numeric:tabular-nums;font-weight:900}.hidden{display:none}.colorDot{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:7px}.notice{border-left:4px solid #777;padding-left:14px}.score{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2b2e37}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #343741;background:#111319;color:white;font-size:16px}.small{font-size:13px}.center{text-align:center}
</style></head><body><div class='app' id='app'></div><script>
const COLORS=[{n:'Rot',c:'#ff4d55'},{n:'Blau',c:'#4b83ff'},{n:'Grün',c:'#36c982'},{n:'Gelb',c:'#ffd447'}];
const statements=[
'Es ist schlimmer, emotionale Gefühle für jemand anderen zu entwickeln, als einmal betrunken fremdzugehen.',
'Wenn dein bester Freund fremdgeht, solltest du es seinem Partner sagen – auch wenn die Freundschaft daran zerbricht.',
'Mit dem Ex eines guten Freundes etwas anzufangen ist okay, wenn die Beziehung seit über einem Jahr vorbei ist.',
'Eine Notlüge ist in einer Beziehung manchmal besser als vollständige Ehrlichkeit.',
'Wer nach einem guten Date drei Tage absichtlich nicht antwortet, verhält sich respektloser als jemand, der direkt absagt.',
'Bei einem großen Streit sollte man eher eine Nacht Abstand nehmen als das Problem sofort klären.',
'Wenn zwei Freunde dieselbe Person daten wollen, sollte niemand aus Loyalität automatisch zurücktreten.',
'Es ist verständlich, den Standort des Partners wissen zu wollen, aber nicht seine Nachrichten zu kontrollieren.',
'Ein Freund, der immer ehrlich kritisiert, ist wertvoller als einer, der dich meistens unterstützt.',
'Für 100.000 € wäre es vertretbar, einem engen Freund ein peinliches Geheimnis zu verraten, wenn niemand erfährt, woher es kam.'
];
const roleSets=[
['Stimme der Aussage zu','Widersprich der Aussage','Verteidige die Aussage gegen Kritik','Greife die Argumentation der Aussage an'],
['Unterstütze die aktuelle Mehrheitsmeinung','Stelle dich gegen die aktuelle Mehrheitsmeinung','Relativiere beide Seiten','Versuche jemanden von der Gegenposition zu überzeugen'],
['Argumentiere emotional dafür','Argumentiere sachlich dagegen','Finde ein Beispiel, das die Aussage stützt','Finde ein Gegenbeispiel, das die Aussage schwächt']
];
let state={players:['Mark','Anna','Leon','Sophie','Max','Lena'],assign:{},round:0,scores:{},screen:'setup',active:null,guessTarget:null,lastGuess:null};
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function assign(){let bag=[];while(bag.length<state.players.length) for(let i=0;i<COLORS.length&&bag.length<state.players.length;i++) bag.push(i);bag.sort(()=>Math.random()-.5);state.players.forEach((p,i)=>{state.assign[p]=bag[i];state.scores[p]=0})}
function setup(){app.innerHTML=`<div class='brand'>PARTY PROTOTYPE</div><h1 class='title'>COLOR BLUFF</h1><p class='muted'>Geheime Farbe. Wechselnde Rolle. Bluffen, beobachten, erraten.</p><div class='card'><b>Spieler</b><p class='small muted'>Ein Name pro Zeile.</p><textarea id='names' style='width:100%;height:150px;padding:14px;border-radius:12px;background:#111319;color:#fff;border:1px solid #343741;font-size:16px'>${state.players.join('\n')}</textarea><br><br><button class='btn' onclick='start()'>Spiel starten</button></div>`}
function start(){let v=document.getElementById('names').value.split('\n').map(x=>x.trim()).filter(Boolean);if(v.length<4)return alert('Mindestens 4 Spieler.');state.players=v;assign();state.screen='pass';state.active=0;renderPass()}
function renderPass(){let p=state.players[state.active];let col=COLORS[state.assign[p]];app.innerHTML=`<div class='brand'>GEHEIME VERTEILUNG</div><div class='card center'><p class='muted'>Gib das Gerät an</p><h1>${esc(p)}</h1><button class='btn' onclick='revealRole()'>Meine Farbe anzeigen</button></div>`}
function revealRole(){let p=state.players[state.active],col=COLORS[state.assign[p]];app.innerHTML=`<div class='card center'><p class='muted'>${esc(p)}, deine geheime Farbe ist</p><div style='font-size:58px;font-weight:900;color:${col.c}'>● ${col.n}</div><p>Merke sie dir. Nicht zeigen.</p><button class='btn secondary' onclick='nextPass()'>Verbergen & weiter</button></div>`}
function nextPass(){state.active++; if(state.active>=state.players.length){state.round=0;nextRound()}else renderPass()}
function nextRound(){state.round++; if(state.round>8)return finale(); if(state.round>1 && (state.round===3||state.round===6||Math.random()<.18)) return suspicion(); state.screen='round';let set=roleSets[(state.round-1)%roleSets.length];let statement=statements[(state.round-1)%statements.length];app.innerHTML=`<div class='brand'>RUNDE ${state.round} / 8</div><div class='card'><div class='statement'>„${statement}“</div></div><div class='card'><b>Rollen dieser Runde</b>${COLORS.map((x,i)=>`<p><span class='colorDot' style='background:${x.c}'></span><b>${x.n}</b> — ${set[i]}</p>`).join('')}</div><div class='row'><button class='btn' onclick='discussion()'>Diskussion starten</button><button class='btn secondary' onclick='privateInstructions()'>Private Rollenansicht</button></div>`}
function privateInstructions(){state.active=0;privatePass()}
function privatePass(){let p=state.players[state.active];app.innerHTML=`<div class='card center'><p class='muted'>Gib das Gerät an</p><h1>${esc(p)}</h1><button class='btn' onclick='showPrivate()'>Anweisung anzeigen</button></div>`}
function showPrivate(){let p=state.players[state.active],ci=state.assign[p],col=COLORS[ci],set=roleSets[(state.round-1)%roleSets.length];app.innerHTML=`<div class='card center'><p class='muted'>Deine Aufgabe</p><div class='role' style='color:${col.c}'>${set[ci]}</div><br><button class='btn secondary' onclick='nextPrivate()'>Verbergen & weiter</button></div>`}
function nextPrivate(){state.active++; if(state.active>=state.players.length)discussion(); else privatePass()}
let tInt;function discussion(){clearInterval(tInt);let t=60;app.innerHTML=`<div class='brand'>RUNDE ${state.round}</div><div class='card center'><p class='muted'>Diskutiert. Spielt eure Rolle, ohne eure Farbe zu verraten.</p><div class='timer' id='timer'>60</div><button class='btn secondary' onclick='nextRound()'>Runde beenden</button></div>`;tInt=setInterval(()=>{t--;let e=document.getElementById('timer');if(e)e.textContent=t;if(t<=0){clearInterval(tInt);nextRound()}},1000)}
function suspicion(){let a=state.players[Math.floor(Math.random()*state.players.length)],b;do{b=state.players[Math.floor(Math.random()*state.players.length)]}while(b===a);state.active=a;state.guessTarget=b;app.innerHTML=`<div class='brand'>VERDACHT</div><div class='card center'><h2>${esc(a)}</h2><p>Welche Farbe glaubst du, hat <b>${esc(b)}</b>?</p><div class='row' style='justify-content:center'>${COLORS.map((x,i)=>`<button class='btn' style='background:${x.c};color:${i===3?'#111':'#fff'}' onclick='makeGuess(${i})'>${x.n}</button>`).join('')}</div><p class='small muted'>Die richtige Antwort wird noch nicht verraten.</p></div>`}
function makeGuess(i){let correct=i===state.assign[state.guessTarget]; if(correct)state.scores[state.active]++;state.lastGuess={a:state.active,b:state.guessTarget,i,correct};app.innerHTML=`<div class='card center'><h2>${esc(state.active)} glaubt:</h2><div style='font-size:38px;font-weight:900;color:${COLORS[i].c}'>${esc(state.guessTarget)} ist ${COLORS[i].n}</div><p class='muted'>Ob das stimmt, bleibt geheim.</p><button class='btn' onclick='nextRound()'>Weiter</button></div>`}
function finale(){app.innerHTML=`<div class='brand'>FINALE</div><h1 class='title'>Auflösung</h1><div class='card'>${state.players.map(p=>{let c=COLORS[state.assign[p]];return `<div class='score'><b>${esc(p)}</b><span style='color:${c.c};font-weight:900'>● ${c.n}</span></div>`}).join('')}</div><div class='card'><h2>Verdachtspunkte</h2>${state.players.slice().sort((a,b)=>state.scores[b]-state.scores[a]).map(p=>`<div class='score'><span>${esc(p)}</span><b>${state.scores[p]}</b></div>`).join('')}</div><button class='btn' onclick='location.reload()'>Neue Partie</button>`}
setup();
</script></body></html>
